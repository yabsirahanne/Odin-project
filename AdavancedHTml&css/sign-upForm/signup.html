<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
     <div class="container">
  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="logo-container">
      <img src="odin-logo.png" alt="Odin Logo" class="logo-img">
      <span class="logo-text">ODIN</span>
    </div>
    <div class="credit">Photo by <a href="halie-west-25xggax4bSA-unsplash.jpg">Yeabsira Hane</a> on <a href="#">Unsplash</a></div>
  </div>

  <!-- Right Content Area -->
  <div class="main-content">
    <div class="intro-text">
      <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
      <p>Sign up <em>now</em> to get started.</p>
      <p>You <em>know</em> you want to.</p>
    </div>

    <!-- Form Container -->
    <div class="form-container">
      <h2>Let's do this!</h2>
      <form>
        <div class="form-row">
          <div class="input-group">
  <label for="first_name">FIRST NAME</label>
  <input type="text" id="first_name" placeholder="Thor">
</div>
<div class="input-group">
  <label for="last_name">LAST NAME</label>
  <input type="text" id="last_name" placeholder="Odinson">
</div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="email">EMAIL</label>
            <input type="email" id="email">
          </div>
          <div class="input-group">
            <label for="phone">PHONE NUMBER</label>
            <input type="tel" id="phone">
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" class="error">
          </div>
          <div class="input-group">
            <label for="confirm_password">CONFIRM PASSWORD</label>
            <input type="password" id="confirm_password" class="error">
          </div>
        </div>
      </form>
    </div>

    <div class="action-container">
      <button type="submit">Create Account</button>
      <p>Already have an account? <a href="#">Log in</a></p>
    </div>
  </div>
</div>
  </body>
</html>
